[metadata]
name = yggotine-plus
license_expression = GPL-3.0-or-later
description = Graphical client for the Soulseek peer-to-peer network over IPv6
long_description =
    Yggotine+ is a graphical client for the Soulseek peer-to-peer network,
    forked from Nicotine+ to support IPv6 exclusively.

    Share files, chat, and find people with similar interests. It is
    user-friendly, fast, free, and open source, and interoperates with
    other Soulseek clients reachable over IPv6.
author = Nicotine+ Team
author_email = nicotine-team@lists.launchpad.net
url = https://github.com/Cosebdd/Yggotine-plus
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: X11 Applications :: GTK
    Intended Audience :: End Users/Desktop
    Operating System :: OS Independent
    Programming Language :: Python
    Topic :: Communications :: Chat
    Topic :: Communications :: File Sharing
    Topic :: Internet
    Topic :: System :: Networking

; The version, packages, package_dir and scripts options are set in setup.py
; instead. They depend on a generated copy of the module, which does not exist
; until setup.py has run, and this file is also read by build-aux/windows/setup.py.
[options]
python_requires = >=3.10
install_requires = PyGObject>=3.38

[options.package_data]
* = *.css, *.csv, *.md, *.mo, *.svg, *.ui, PLUGININFO

[options.data_files]
share/applications = data/org.yggotine_plus.Yggotine.desktop
share/metainfo = data/org.yggotine_plus.Yggotine.appdata.xml
share/man/man1 = data/yggotine.1
share/icons/hicolor/16x16/apps = pynicotine/gtkgui/icons/hicolor/16x16/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/16x16@2/apps = pynicotine/gtkgui/icons/hicolor/16x16@2/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/24x24/apps = pynicotine/gtkgui/icons/hicolor/24x24/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/24x24@2/apps = pynicotine/gtkgui/icons/hicolor/24x24@2/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/32x32/apps = pynicotine/gtkgui/icons/hicolor/32x32/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/32x32@2/apps = pynicotine/gtkgui/icons/hicolor/32x32@2/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/48x48/apps = pynicotine/gtkgui/icons/hicolor/48x48/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/48x48@2/apps = pynicotine/gtkgui/icons/hicolor/48x48@2/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/64x64/apps = pynicotine/gtkgui/icons/hicolor/64x64/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/64x64@2/apps = pynicotine/gtkgui/icons/hicolor/64x64@2/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/128x128/apps = pynicotine/gtkgui/icons/hicolor/128x128/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/128x128@2/apps = pynicotine/gtkgui/icons/hicolor/128x128@2/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/256x256/apps = pynicotine/gtkgui/icons/hicolor/256x256/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/256x256@2/apps = pynicotine/gtkgui/icons/hicolor/256x256@2/apps/org.yggotine_plus.Yggotine.png
share/icons/hicolor/symbolic/apps = pynicotine/gtkgui/icons/hicolor/symbolic/apps/org.yggotine_plus.Yggotine-symbolic.svg
share/icons/hicolor/scalable/apps =
    pynicotine/gtkgui/icons/hicolor/scalable/apps/org.yggotine_plus.Yggotine.svg
    pynicotine/gtkgui/icons/hicolor/scalable/apps/org.yggotine_plus.Yggotine-away.svg
    pynicotine/gtkgui/icons/hicolor/scalable/apps/org.yggotine_plus.Yggotine-connect.svg
    pynicotine/gtkgui/icons/hicolor/scalable/apps/org.yggotine_plus.Yggotine-disconnect.svg
    pynicotine/gtkgui/icons/hicolor/scalable/apps/org.yggotine_plus.Yggotine-msg.svg

[options.extras_require]
packaging = cx_Freeze
tests = pycodestyle; pylint

[pycodestyle]
max-line-length = 120
exclude = build/, venv/

[pylint]
disable =
    broad-except,
    c-extension-no-member,
    consider-using-assignment-expr,
    cyclic-import,
    duplicate-code,
    fixme,
    import-outside-toplevel,
    missing-class-docstring,
    missing-function-docstring,
    missing-module-docstring,
    no-value-for-parameter,
    superfluous-parens
enable =
    consider-using-augmented-assign,
    use-implicit-booleaness-not-comparison-to-string,
    use-implicit-booleaness-not-comparison-to-zero
ignore-paths =
    build,
    pynicotine/locale,
    venv
load-plugins =
    pylint.extensions.bad_builtin,
    pylint.extensions.check_elif,
    pylint.extensions.code_style,
    pylint.extensions.comparison_placement,
    pylint.extensions.consider_refactoring_into_while_condition,
    pylint.extensions.for_any_all,
    pylint.extensions.dict_init_mutate,
    pylint.extensions.dunder,
    pylint.extensions.eq_without_hash,
    pylint.extensions.overlapping_exceptions,
    pylint.extensions.private_import,
    pylint.extensions.set_membership,
    pylint.extensions.typing
py-version = 3.10

[pylint.design]
max-args = 18
max-attributes = 125
max-bool-expr = 6
max-branches = 40
max-locals = 40
max-positional-arguments = 15
max-public-methods = 85
max-returns = 12
max-statements = 125
min-public-methods = 0

[pylint.format]
max-line-length = 120
max-module-lines = 4500

[pylint.refactoring]
max-nested-blocks = 6

[pylint.similarities]
min-similarity-lines = 15

[pylint.variables]
additional-builtins = _, ngettext
